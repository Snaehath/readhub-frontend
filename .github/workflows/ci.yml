name: Frontend CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
        working-directory: .
      - run: npm run type-check
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm audit --audit-level=high
        working-directory: .
